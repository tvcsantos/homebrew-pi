name: Bump formula on new release

on:
  schedule:
    # Every day at 8:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Bump
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check and update formula
        id: update
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const https = require('https');

            function fetch(url) {
              return new Promise((resolve, reject) => {
                https.get(url, (res) => {
                  if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                    return resolve(fetch(res.headers.location));
                  }
                  const chunks = [];
                  res.on('data', chunk => chunks.push(chunk));
                  res.on('end', () => resolve(Buffer.concat(chunks)));
                  res.on('error', reject);
                }).on('error', reject);
              });
            }

            async function sha256(buffer) {
              const crypto = require('crypto');
              return crypto.createHash('sha256').update(buffer).digest('hex');
            }

            const formula = fs.readFileSync('Formula/pi.rb', 'utf8');

            const currentUrlMatch = formula.match(/^\s*url\s+"([^"]+)"/m);
            if (!currentUrlMatch) throw new Error('Could not find url in formula');
            const currentUrl = currentUrlMatch[1];

            const currentVersionMatch = currentUrl.match(/(\d+\.\d+\.\d+)\.tgz$/);
            if (!currentVersionMatch) throw new Error('Could not parse version from url');
            const currentVersion = currentVersionMatch[1];

            const packageNameMatch = currentUrl.match(/registry\.npmjs\.org\/([^/]+\/[^/]+)\/-\//);
            if (!packageNameMatch) throw new Error('Could not parse package name from url');
            const packageName = packageNameMatch[1];

            const registryData = JSON.parse(await fetch(`https://registry.npmjs.org/${packageName}/latest`));
            const latestVersion = registryData.version;
            const newUrl = registryData.dist.tarball;

            core.info(`Current: ${currentVersion}, Latest: ${latestVersion}`);

            if (currentVersion === latestVersion) {
              core.info('Formula is up to date');
              core.setOutput('needs_update', 'false');
              return;
            }

            core.info(`Updating ${currentVersion} -> ${latestVersion}`);
            const tarball = await fetch(newUrl);
            const newSha256 = await sha256(tarball);

            const updated = formula
              .replace(currentUrl, newUrl)
              .replace(/sha256 "[^"]+"/, `sha256 "${newSha256}"`);
            fs.writeFileSync('Formula/pi.rb', updated);

            core.setOutput('needs_update', 'true');
            core.setOutput('current', currentVersion);
            core.setOutput('latest', latestVersion);

      - name: Create pull request
        if: steps.update.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bump-pi-${{ steps.update.outputs.latest }}
          commit-message: "chore: bump pi ${{ steps.update.outputs.current }} -> ${{ steps.update.outputs.latest }}"
          title: "chore: bump pi ${{ steps.update.outputs.current }} -> ${{ steps.update.outputs.latest }}"
          body: "Automated bump of `pi` formula to [v${{ steps.update.outputs.latest }}](https://www.npmjs.com/package/@earendil-works/pi-coding-agent/v/${{ steps.update.outputs.latest }})."
